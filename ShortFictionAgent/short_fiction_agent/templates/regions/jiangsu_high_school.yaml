# 江苏高中校园设定参考
region: "江苏"
education_system: "3+1+2新高考模式"
features:
  - "学业竞争激烈，全省统一高考"
  - "月考、周练频繁"
  - "理科重点班/文科重点班分班制度"
  - "晚自习普遍，走读生可申请不上"
  - "校服多为运动服款，周一升旗必须穿"
  - "小高考（学业水平测试）在高二下学期"
exam_system:
  - "高一：适应 + 选科意向"
  - "高二上：分班 + 学测准备"
  - "高二下：小高考"
  - "高三上：一轮复习 + 模考"
  - "高三下：二轮复习 + 三轮冲刺 + 高考"
school_life:
  - "早读：7:20前到校"
  - "午休：12:00-14:00 可在教室或回家"
  - "晚自习：18:30-21:00（走读可选）"
  - "大课间：跑操"
  - "食堂：分楼层，一楼快餐二楼点菜"
typical_conflicts:
  - "分科/选科压力"
  - "成绩排名焦虑"
  - "家长期待与现实差距"
  - "重点班与普通班的身份认同"
