# 大学通用设定参考
region: "通用"
university_type: "综合类/理工类/师范类"
features:
  - "大一：适应期，通识课为主，社团招新"
  - "大二：专业课加多，确定方向"
  - "大三：实习/考研/出国的分叉口"
  - "大四：毕设/求职/离别"
relationship_stages:
  - "大一：新鲜感，试探，暗恋高发期"
