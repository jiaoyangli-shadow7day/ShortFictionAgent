  - "选修课坐在一起"
  - "周末校外小吃街/逛街"
  - "寒暑假前在车站/机场送别"
  - "跨年/圣诞/生日"
  - "毕业照/散伙饭"
typical_conflicts:
  - "考研/出国 vs 一起留在某个城市"
  - "家境差异"
  - "未来规划不同"
  - "异地恋"
  - "前任/新出现的人"
