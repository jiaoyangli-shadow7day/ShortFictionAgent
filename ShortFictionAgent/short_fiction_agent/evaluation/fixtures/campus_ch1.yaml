chapter_outline:
  chapter_id: 1
  reader_hook: 转学生被安排到年级前三后座，第一天就暴露语文强、数学短板的反差
  story_question: 林栀能不能不被偏科标签压住？陈屿为什么注意到她的错题？
  character_desire: 林栀想在新班级不被看轻
  main_event: 班主任介绍转学生林栀，安排她坐在陈屿后面；班级私下议论她数学分数
  obstacle: 重点班看重成绩，她的数学短板被同学议论
  action: 林栀稳住语文小测，陈屿把多印的数学笔记留在桌角
  cost: 林栀被贴上偏科标签，陈屿的异常关注被周诚看见
  relationship_turn: 陈屿从不关注新同学转为记住她的名字、强项和短板
  irreversible_change: 林栀不再只是转学生，而成为陈屿视野里第一个矛盾具体的人
  viral_scene: 全班议论林栀数学分数时，陈屿把多印笔记推到桌角
  emotional_intensity: 3
  ending_hook: 放学后林栀发现抽屉里有一颗薄荷糖，糖纸背面写着她数学错题的页码
  next_chapter_question: 是谁知道她那道题错在哪里，又为什么不署名？
  forbidden_items: [禁止让陈屿过于热情, 禁止出现明显暧昧对话]
