name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Chinese fonts for optional card export tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -e ./ShortFictionAgent
      - run: python -m unittest discover -s ShortFictionAgent/tests -p 'test_*.py'
        env:
          PYTHONPATH: ShortFictionAgent:ShortFictionAgent/tests
      - run: python -m pip wheel --no-deps ./ShortFictionAgent --wheel-dir /tmp/wheels
